server:
  port: 8081

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/fitness_user_db_new}
    username: ${USER_DB_USERNAME:fitness_app}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
