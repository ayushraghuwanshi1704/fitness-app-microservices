spring:
  application:
    name: activity-service
  data:
    mongodb:
      uri: ${ACTIVITY_MONGODB_URI:mongodb://localhost:27017/fitnessactivity}
      database: fitnessactivity
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
